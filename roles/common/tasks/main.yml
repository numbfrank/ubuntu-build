---
# tasks file for common

- name: Add an Apt signing key, uses whichever key is at the URL
  ansible.builtin.apt_key:
    url: https://apt.releases.hashicorp.com/gpg
    state: present
    
- name: Add specified repository into sources list using specified filename
  ansible.builtin.apt_repository:
    repo: deb [arch=amd64] https://apt.releases.hashicorp.com jammy main
    state: present
    filename: hashicorp

# - name: Add ansible stable repository from PPA and install its signing key on Ubuntu target
#   ansible.builtin.apt_repository:
#     repo: ppa:ansible/ansible
#     state: present
#     filename: ansible

- name: Upgrade the OS (apt-get dist-upgrade)
  apt:
    upgrade: dist
    update_cache: true

- name: Add apt packages
  apt:
    pkg:
      #- ansible
      #- ansible-core
      - chrome-gnome-shell
      - curl
      - dconf-editor
      - git
      - git-lfs
      - gnome-shell-extensions
      - gnome-tweaks
      - gnupg
      - locate
      - openssh-server
      - packer
      - python3
      - python3-apt
      - python3-pip
      - software-properties-common
      - terminator
      - terraform
      - tmux
      - vagrant
      - zsh
    state: present
    update_cache: false

- name: Install ansible python package
  pip:
    name: ansible
    state: latest


- name: Linux | Check Git LFS initialization                                          
  git_config:                                                                         
    list_all: true 
    scope: global
  register: git_global_config

- name: Linux | Setup Git LFS
  command: git lfs install
  when: "'filter.lfs.required' not in git_global_config.config_values"

- name: Download the awscli bundle.
  get_url: 
    url: https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip
    dest: /tmp/awscliv2.zip
  register: aws_cli_download

- name: Unarchive the installer.
  unarchive: 
    src: /tmp/awscliv2.zip
    dest: /tmp 
    copy: no 
    creates: /tmp/aws
  when: aws_cli_download.changed
  register: aws_cli_unarchive_installer

- name: Install awscli package.
  shell: /tmp/aws/install
  args:
    creates: /usr/bin/aws
  when: aws_cli_unarchive_installer.changed

